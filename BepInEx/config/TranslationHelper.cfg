[General]

## The name of the language folder located at TranslationHelper\translation\{lang}
# Setting type: String
# Default value: en
lang = en

## Sets the spacing between characters in dialog fields.
## Optimal range: [-60.0, 60.0], depending on the language
# Setting type: Single
# Default value: 0
characterSpacing = 0

## Sets the font size for characters in dialog fields.
# Setting type: Single
# Default value: 18
characterFontSize = 18

## Enable auto size for characters in dialog fields.
## If there isn't enough space in the text field, it will automatically reduce the character size.
# Setting type: Boolean
# Default value: true
characterAutoSize = true

## This allows you to use your own font in dialog boxes;
## you need to place the font file in the TranslationHelper\font directory.
## Example "umeboshi.ttf".
# Setting type: String
# Default value: default
customFontDialogs = default

## This allows you to use your own font in textUI fields;
## you need to place the font file in the TranslationHelper\font directory.
## Example "umeboshi.ttf"
## For each interface element, you need to manually enable the font for it in the textui.txt file located at TranslationHelper\translation\{lang}\textui\textui.txt
# Setting type: String
# Default value: default
customFontTextUI = default

[Utility]

## Enable debug mode. Displays information in the console about captured objects
# Setting type: Boolean
# Default value: false
debugMode = false

## Enable logging for dialog fields.
# Setting type: Boolean
# Default value: false
dialogLog = false

## Enable writing a log file with captured objects (debug mode must be enabled).
## The log file will be created in the TranslationHelper\logs folder.
# Setting type: Boolean
# Default value: false
writeLogFile = false

## Maximum number of logs; if the number exceeds this value, the oldest file is overwritten.
## To remove the limit, set the value to -1 (maximum value: 32,767).
# Setting type: Int16
# Default value: 20
maxLogFiles = 20

## Enable creating dialog files for translation.
## All dialogues captured during the process will be saved in a file ready for translation.
## The files will be created in the TranslationHelper\dump\dialogs folder.
## Does not overwrite files that have already been created.
# Setting type: Boolean
# Default value: false
createDialogFiles = false

## Enable creating textUI files for translation.
## All TextMeshPro, TextMeshProUGUI, DisplayMessage captured during the process will be saved in a file ready for translation.
## The file will be created in the TranslationHelper\dump\textui folder.
## Does not create duplicates, unless their hashes do match.
# Setting type: Boolean
# Default value: false
createTextUIFile = false

